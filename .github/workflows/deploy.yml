name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola pubblicazione alla volta, senza annullare quelle gia' in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Astro 7 richiede Node >=22.12; l'action da sola userebbe la 20.
          node-version: 22
        env:
          # Finche' il sito sta su walter-esposito.github.io/waltermakerlabs/ serve
          # il base path, altrimenti link e immagini vanno in 404. La build con
          # SITE_BASE si marca anche noindex, per non farsi indicizzare e creare
          # contenuto duplicato quando arrivera' il dominio vero.
          # QUANDO SI COLLEGA waltermakerlabs.it: cancellare queste due righe.
          SITE_BASE: waltermakerlabs

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
